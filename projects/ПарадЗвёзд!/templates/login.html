<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Панель администратора</title>
    <link rel="stylesheet" href="/projects/ПарадЗвёзд!/static/styles.css">
</head>
<body>
    <div class="page-container">
        <div class="container" style="max-width:450px; margin-top:100px;">
            <a href="../index.html" class="btn btn-outline" style="margin-bottom:20px;">← На главную</a>
            <div class="form-card">
                <div class="card-header" style="text-align:center;">
                    <h1 style="font-size:2rem;">🔐</h1>
                    <h2>Вход для администратора</h2>
                    <p style="color:#6b7280;">Введите логин и пароль</p>
                </div>
                <div class="card-body">
                    <form method="post" action="../admin/login">
                        <div class="form-group"><label>Логин</label><input type="text" name="username" required autofocus></div>
                        <div class="form-group"><label>Пароль</label><input type="password" name="password" required></div>
                        <div id="errorBox" style="display:none;padding:12px;background:#fee2e2;color:#b91c1c;border-radius:12px;margin-bottom:20px;text-align:center;"></div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('errorBox').textContent = decodeURIComponent(error);
            document.getElementById('errorBox').style.display = 'block';
        }
    </script>
</body>
</html>
