<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Панель администратора</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="page-container">
        <div class="container" style="max-width:450px; margin-top:100px;">
            <a href="index.html" class="btn btn-outline" style="margin-bottom:20px;">← На главную</a>
            <div class="form-card">
                <div class="card-header" style="text-align:center;">
                    <h1 style="font-size:2rem;">🔐</h1>
                    <h2>Вход для администратора</h2>
                    <p style="color:#6b7280;">Введите логин и пароль</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="form-group"><label>Логин</label><input type="text" name="username" required autofocus></div>
                        <div class="form-group"><label>Пароль</label><input type="password" name="password" required></div>
                        <div id="error-message" style="padding:12px;background:#fee2e2;color:#b91c1c;border-radius:12px;margin-bottom:20px;text-align:center;display:none;"></div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = this.username.value;
            const password = this.password.value;
            const res = await fetch('../api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = 'admin-panel.html';
            } else {
                document.getElementById('error-message').textContent = data.error || 'Ошибка входа';
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
