<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление номинациями - Админ</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="page-container">
        <div class="container">
            <div class="header-section">
                <a href="admin" class="btn btn-outline">← В админ-панель</a>
                <h1 class="page-title">Управление номинациями</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="exportData()">💾 Экспорт</button>
                    <label class="btn btn-outline" style="cursor: pointer;">📂 Импорт<input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(this)"></label>
                </div>
            </div>
            <p class="page-description">Выберите номинацию для управления записями участников.</p>
            <div class="nominations-grid">
                <a href="nomination/zvezdnyy-lider" class="nomination-btn btn-orange">Звёздный лидер</a>
                <a href="nomination/zvezdnyy-nastavnik" class="nomination-btn btn-yellow">Звёздный наставник</a>
                <a href="nomination/zvezdnyy-partner" class="nomination-btn btn-lime">Звёздный партнёр</a>
                <a href="nomination/zvezdnyy-aktiv" class="nomination-btn btn-green">Звёздный актив</a>
                <a href="nomination/zvezdnaya-stsena" class="nomination-btn btn-teal">Звёздная сцена</a>
                <a href="nomination/zvezdnaya-podderzhka" class="nomination-btn btn-cyan">Звёздная поддержка</a>
                <a href="nomination/zvezdnyy-start" class="nomination-btn btn-blue">Звёздный старт</a>
                <a href="nomination/zvezdnoe-stremlenie" class="nomination-btn btn-purple">Звёздное стремление</a>
                <a href="nomination/zvezdnoe-masterstvo" class="nomination-btn btn-fuchsia">Звёздное мастерство</a>
                <a href="nomination/zvezdnyy-intellekt" class="nomination-btn btn-pink">Звёздный интеллект</a>
                <a href="nomination/zvezdnyy-vypusknik" class="nomination-btn btn-red">Звёздный выпускник</a>
            </div>
        </div>
    </div>
    <script>
        function exportData() {
            window.location.href = '../api/admin/export';
        }
        async function importData(input) {
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            const res = await fetch('../api/admin/import', { method: 'POST', body: formData });
            const result = await res.json();
            if (result.success) {
                alert('Данные успешно импортированы!');
                location.reload();
            } else {
                alert('Ошибка: ' + result.error);
            }
        }
    </script>
</body>
</html>
