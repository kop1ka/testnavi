<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление сценариями - Админ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-container">
        <div class="container">
            <div class="header-section">
                <a href="{{ url_for('parad_zvezd.admin_panel') }}" class="btn btn-outline">← В админ-панель</a>
                <h1 class="page-title">Сценарии мероприятий</h1>
                <button class="btn btn-success" onclick="showAddForm()">+ Добавить сценарий</button>
            </div>
            <div id="formCard" class="form-card" style="display: none;">
                <div class="card-header"><h2>Добавить сценарий</h2></div>
                <div class="card-body">
                    <div class="form-group"><label>Название</label><input type="text" id="scenarioName" placeholder="Название сценария"></div>
                    <div class="form-group">
                        <label>Файл</label>
                        <button type="button" class="btn btn-primary" onclick="window.open('https://vm-ftp.anosov.ru/vm/Парад/', '_blank')" style="margin-bottom:10px;">📂 Открыть папку</button>
                        <div style="display:flex;gap:10px;"><input type="text" id="scenarioUrl" placeholder="Ссылка на файл" style="flex:1;"><button type="button" class="btn btn-primary" onclick="loadScenario()">Загрузить</button></div>
                        <div id="filePreview" style="display:none; margin-top:10px;"><strong>Файл:</strong> <span id="fileName"></span></div>
                    </div>
                    <div class="form-actions"><button class="btn btn-primary" onclick="saveScenario()">Добавить</button><button class="btn btn-outline" onclick="cancelForm()">Отмена</button></div>
                </div>
            </div>
            <div id="scenariosList"><div class="empty-state" id="emptyState"><p>Загрузка...</p></div></div>
        </div>
    </div>
    <script>
        let currentFileData = '', currentFileName = '';

        async function loadScenarios() {
            const res = await fetch('/api/admin/scenarios');
            const scenarios = await res.json();
            const container = document.getElementById('scenariosList');
            const emptyState = document.getElementById('emptyState');
            if (!scenarios.length) {
                emptyState.innerHTML = '<p>Сценариев пока нет. Нажмите "Добавить".</p>';
                emptyState.style.display = 'block';
                container.innerHTML = '';
                return;
            }
            emptyState.style.display = 'none';
            container.innerHTML = '';
            scenarios.forEach(s => {
                const card = document.createElement('div');
                card.className = 'scenario-card';
                const icon = { pdf:'📕', doc:'📘', docx:'📘', txt:'📝' }[s.fileName.split('.').pop().toLowerCase()] || '📄';
                card.innerHTML = `
                    <div class="scenario-icon"><div class="icon-circle"><span class="file-icon">${icon}</span></div><div><p class="scenario-name">${escapeHtml(s.name)}</p><p class="scenario-date">${s.createdAt}</p></div></div>
                    <div class="scenario-actions"><button class="btn-icon btn-view" onclick="viewScenario('${s.id}')">👁️</button><button class="btn-icon btn-delete" onclick="deleteScenario('${s.id}')">🗑️</button></div>
                `;
                container.appendChild(card);
            });
        }

        function showAddForm() {
            currentFileData = ''; currentFileName = '';
            document.getElementById('scenarioName').value = '';
            document.getElementById('scenarioUrl').value = '';
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('formCard').style.display = 'block';
        }

        function loadScenario() {
            const url = document.getElementById('scenarioUrl').value.trim();
            if (!url) { alert('Введите ссылку'); return; }
            const parts = url.split('/');
            currentFileName = decodeURIComponent(parts[parts.length-1]);
            currentFileData = url;
            document.getElementById('fileName').textContent = currentFileName;
            document.getElementById('filePreview').style.display = 'block';
        }

        async function saveScenario() {
            const name = document.getElementById('scenarioName').value.trim();
            if (!name || !currentFileData) { alert('Заполните все поля'); return; }
            const res = await fetch('/api/admin/scenarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, fileData: currentFileData, fileName: currentFileName })
            });
            if (res.ok) { cancelForm(); loadScenarios(); }
            else alert('Ошибка сохранения');
        }

        async function deleteScenario(id) {
            if (!confirm('Удалить сценарий?')) return;
            const res = await fetch(`/api/admin/scenarios?id=${id}`, { method: 'DELETE' });
            if (res.ok) loadScenarios();
            else alert('Ошибка удаления');
        }

        function viewScenario(id) {  // просто открываем в новой вкладке (можно улучшить)
            fetch('/api/admin/scenarios').then(r=>r.json()).then(scenarios=>{
                const s = scenarios.find(s=>s.id===id);
                if(s) window.open(s.fileData, '_blank');
            });
        }

        function cancelForm() { document.getElementById('formCard').style.display = 'none'; }
        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
        loadScenarios();
    </script>
</body>
</html>
