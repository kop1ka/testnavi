<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парад Звёзд - Сценарии</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-container">
        <div class="container">
            <div class="header-section">
                <a href="{{ url_for('parad_zvezd.nominations_public') }}" class="btn btn-outline">← Назад к номинациям</a>
                <h1 class="page-title">Сценарии мероприятий</h1>
            </div>
            <p class="page-description">Каждый год для мероприятий создаются уникальные сценарии. Вы можете ознакомиться с ними ниже, нажав на иконку.</p>
            <div id="scenariosList">
                <div class="empty-state" id="emptyState"><p>Загрузка...</p></div>
            </div>
        </div>
    </div>

    <div id="scenarioModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Сценарий</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        async function loadScenarios() {
            const res = await fetch('/api/scenarios');
            const scenarios = await res.json();
            const container = document.getElementById('scenariosList');
            const emptyState = document.getElementById('emptyState');
            if (!scenarios.length) {
                emptyState.innerHTML = '<p>Сценариев пока нет.</p>';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            container.innerHTML = '';
            scenarios.forEach(scenario => {
                const card = document.createElement('div');
                card.className = 'scenario-card';
                const fileIcon = getFileIcon(scenario.fileName);
                card.innerHTML = `
                    <div class="scenario-icon" onclick="viewScenario('${scenario.id}')">
                        <div class="icon-circle"><span class="file-icon">${fileIcon}</span></div>
                        <div><p class="scenario-name">${escapeHtml(scenario.name)}</p><p class="scenario-date">${scenario.createdAt}</p></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (ext === 'pdf') return '📕';
            if (ext === 'doc' || ext === 'docx') return '📘';
            if (ext === 'txt') return '📝';
            return '📄';
        }
        async function viewScenario(id) {
            const res = await fetch('/api/scenarios');
            const scenarios = await res.json();
            const scenario = scenarios.find(s => s.id === id);
            if (!scenario) return;
            document.getElementById('modalTitle').textContent = scenario.name;
            const modalBody = document.getElementById('modalBody');
            const ext = scenario.fileName.split('.').pop().toLowerCase();
            if (ext === 'pdf') {
                modalBody.innerHTML = `<embed src="${scenario.fileData}" type="application/pdf" width="100%" height="600px" /><p style="text-align:center;margin-top:10px;"><a href="${scenario.fileData}" target="_blank" class="btn btn-primary">Открыть в новой вкладке</a></p>`;
            } else if (ext === 'txt') {
                try {
                    const text = await fetch(scenario.fileData).then(r => r.text());
                    modalBody.innerHTML = `<pre style="white-space:pre-wrap;max-height:600px;overflow:auto;padding:20px;background:#f9fafb;">${escapeHtml(text)}</pre><p style="text-align:center;margin-top:10px;"><a href="${scenario.fileData}" target="_blank" class="btn btn-primary">Открыть в новой вкладке</a></p>`;
                } catch {
                    modalBody.innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:4rem;">⚠️</div><p>Не удалось загрузить файл</p><a href="${scenario.fileData}" target="_blank" class="btn btn-primary">Открыть напрямую</a></div>`;
                }
            } else {
                modalBody.innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:4rem;">📄</div><h3>${escapeHtml(scenario.fileName)}</h3><a href="${scenario.fileData}" target="_blank" class="btn btn-primary">Открыть в новой вкладке</a></div>`;
            }
            document.getElementById('scenarioModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('scenarioModal').style.display = 'none';
        }
        window.onclick = function(e) {
            const modal = document.getElementById('scenarioModal');
            if (e.target === modal) closeModal();
        };
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        loadScenarios();
    </script>
</body>
</html>
